name: Bug report
description: Something isn't working the way it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the incorrect or unexpected behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, in order, starting from a clean state if possible.
      placeholder: |
        1. wt open my-branch
        2. wt rm -i
        3. ...
      render: shell
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        Fill in all four — these are what every report otherwise needs a
        follow-up question to collect.
      placeholder: |
        OS: e.g. macOS 14.5, Ubuntu 22.04
        bash --version: (first line of `bash --version`)
        wt --version: (output of `wt --version`)
        wt ls: (relevant lines of output, or the full output if short)
      value: |
        OS:
        bash --version:
        wt --version:
        wt ls:
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, `.worktreesync` config, or other context that might help.
    validations:
      required: false
